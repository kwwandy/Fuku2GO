<style>
/* layout: 單欄手機優先；頂欄＋底部頁籤；綠色做主色，橙紅只用於警示 */
:root{
  --bg:#f2f5f4;--card:#ffffff;--ink:#1c2523;--mute:#66726e;--line:#dde4e1;
  --brand:#0f5c4d;--brand-ink:#ffffff;--accent:#c8512b;--warn:#b3261e;--warn-bg:#fdecea;
  --ok:#1b6e3a;--ok-bg:#e6f4ea;--info-bg:#eaf1ef;--chip:#e9eeec;--pend-bg:#fff3cd;--pend:#7a5b00;
  --sh:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);color-scheme:light;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans TC","PingFang HK","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#111716;--card:#1b2220;--ink:#e8eeec;--mute:#9aa7a2;--line:#2b3532;
  --brand:#3fb39b;--brand-ink:#0b1210;--accent:#ff8a63;--warn:#ff8a80;--warn-bg:#3a1f1d;
  --ok:#7bd49a;--ok-bg:#1c2f23;--info-bg:#1a2522;--chip:#26302d;--pend-bg:#3b3216;--pend:#f2d680;--sh:none;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#111716;--card:#1b2220;--ink:#e8eeec;--mute:#9aa7a2;--line:#2b3532;
  --brand:#3fb39b;--brand-ink:#0b1210;--accent:#ff8a63;--warn:#ff8a80;--warn-bg:#3a1f1d;
  --ok:#7bd49a;--ok-bg:#1c2f23;--info-bg:#1a2522;--chip:#26302d;--pend-bg:#3b3216;--pend:#f2d680;--sh:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a{color:var(--brand)}
.hdr{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.hdr h1{font-size:17px;margin:0;flex:1;line-height:1.25}
.hdr small{display:block;font-weight:400;opacity:.85;font-size:12px}
.pill{border:1px solid rgba(255,255,255,.55);border-radius:99px;padding:3px 10px;font-size:12px;background:transparent;color:inherit;white-space:nowrap}
.pill.on{background:var(--brand-ink);color:var(--brand)}
.net{font-size:12px;opacity:.9}
main{padding:12px 14px;max-width:720px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;padding:9px 2px 7px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span.i{display:flex;line-height:1}
.tabs button.on{color:var(--brand);font-weight:600}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.days button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 14px;text-align:center;min-width:64px}
.days button b{display:block;font-size:15px}
.days button span{font-size:12px;color:var(--mute)}
.days button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.days button.on span{color:var(--brand-ink);opacity:.85}
h2{font-size:18px;margin:6px 0 10px;line-height:1.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.slot{display:flex;gap:12px}
.slot .time{flex:0 0 74px;font-size:13px;color:var(--brand);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.35;padding-top:2px}
.slot .body{flex:1;min-width:0}
.slot h3{font-size:15.5px;margin:0 0 4px;line-height:1.35}
.slot p{margin:0 0 6px;font-size:14px;color:var(--ink);opacity:.9}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:99px;padding:4px 10px;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.chip{padding:0;overflow:hidden}
.chip button{border:0;background:none;color:inherit;padding:5px 10px;font-size:13px}
.chip button.drv{padding:5px 9px;border-left:1px solid var(--line);display:flex;align-items:center}
.chip.main button.drv{border-left-color:rgba(255,255,255,.35)}
.chip.main{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.drv-s{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12px;color:var(--brand);background:var(--card);margin-top:6px}
.fs{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--ink);overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.fs .x{align-self:flex-end;font-size:18px;padding:10px 20px;border-radius:99px;border:1px solid var(--line);background:var(--card);position:sticky;top:0}
.fs .cue{font-size:clamp(18px,5vw,26px);color:var(--mute);margin-top:6px}
.fs .big{font-size:clamp(30px,9.5vw,64px);font-weight:700;line-height:1.3;margin:14px 0}
.fs .mid{font-size:clamp(24px,7.4vw,48px);font-weight:600;line-height:1.4;margin:8px 0}
.fitg span{display:block;white-space:nowrap}
.btn.bigbtn{flex:1;font-size:20px;padding:18px 10px;justify-content:center}
.fs .sm{font-size:clamp(15px,4vw,20px);color:var(--mute);margin-top:12px}
.fs .tel{font-size:clamp(20px,6vw,32px);margin-top:14px}
.fs .zz{margin-top:auto;padding-top:18px}
.searchbar{margin-bottom:10px}
.chip.bad{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.lbl{font-size:12px;color:var(--mute);margin:6px 0 0}
.badge{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--mute);margin-right:4px;vertical-align:1px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn);font-weight:600}
.badge.pend{background:var(--pend-bg);color:var(--pend)}
.note{background:var(--info-bg);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:6px}
.row{display:flex;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-size:14px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.dng{color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn.full{width:100%}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:110px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
label{display:block;font-size:12.5px;color:var(--mute);margin:10px 0 3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flight{display:flex;flex-direction:column;gap:6px}
.flight .big{font-size:22px;font-weight:700;letter-spacing:.2px}
.flight .sub{font-size:13px;color:var(--mute)}
.seg{display:flex;gap:6px;margin:0 0 10px;overflow-x:auto}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;font-size:14px;white-space:nowrap}
.seg button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:15px}
.item .t i{display:block;font-style:normal;font-size:13px;color:var(--mute)}
.item .r{font-size:12px;color:var(--mute);text-align:right}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 2px;font-size:19px}
.sheet .ja{font-size:15px;color:var(--mute);margin-bottom:8px}
.addr{font-size:19px;line-height:1.45;padding:10px 12px;border-radius:10px;background:var(--info-bg);margin:8px 0;word-break:break-all}
.kv{display:flex;gap:10px;font-size:14px;margin:4px 0}
.kv b{flex:0 0 52px;color:var(--mute);font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:99px;font-size:14px;z-index:90;max-width:88vw}
.bar{height:10px;border-radius:5px;background:var(--brand);min-width:2px}
.stat{display:grid;grid-template-columns:108px 1fr 84px;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.stat .v{text-align:right;font-variant-numeric:tabular-nums}
.total{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:15px}
.chk input{width:22px;height:22px;margin-top:2px;flex:0 0 auto}
.chk.done span{text-decoration:line-through;opacity:.55}
.empty{text-align:center;color:var(--mute);padding:26px 10px;font-size:14px}
.lock{background:var(--info-bg);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
</style>
</head>

async function copy(text){
  try { await navigator.clipboard.writeText(text); toast("已複製"); return; } catch(e){}
  try {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove();
    toast(ok ? "已複製" : "請長按文字手動複製");
  } catch(e){ toast("請長按文字手動複製"); }
}

  return Math.ceil((start - now)/86400000);

function effChoice(slot){
  const base = slot.choice, o = ov.slotChoice[slot.id];
  if (!base && !o) return null;
  return Object.assign({ primary:null, status:"open", alternates:[] }, base || {}, o || {});
}
const STATUS = { confirmed:["已確定","ok"], first_choice:["暫定首選","pend"], open:["未揀","pend"], pending:["待定","pend"], optional:["選擇性",""] };
function bookBadge(s){
  if (!s.booking) return "";
  return ov.checks[s.booking.check] ? ` <span class="badge ok">${esc(s.booking.done||"已訂位")}</span>` : ` <span class="badge warn">${esc(s.booking.need)}</span>`;
}
function chip(id, date, main){
  const p = getPlace(id); if (!p) return "";
  const bad = closedOn(p, date);
  return `<span class="chip ${main?"main":""} ${bad?"bad":""}"><button type="button" data-place="${esc(id)}" data-date="${esc(date||"")}">${bad?"⚠ ":""}${esc(p.name_zh)}${p.cuisine?`<span style="opacity:.75;font-size:11.5px"> · ${esc(p.cuisine)}</span>`:""}</button><button type="button" class="drv" data-driver="${esc(id)}" aria-label="全螢幕顯示地址（俾司機睇）：${esc(p.name_zh)}">${FSI}</button></span>`;

}

function slotHtml(day, s){
  const ch = effChoice(s);
  let choiceHtml = "";
  const used = new Set();
  if (ch) {
    const [lab, cls] = STATUS[ch.status] || STATUS.open;
    const prim = ch.primary ? chip(ch.primary, day.date, true) : `<span class="badge pend">未決定</span>`;
    if (ch.primary) used.add(ch.primary);
    (ch.alternates||[]).forEach(a => used.add(a));
    choiceHtml = `<div class="lbl"><span class="badge ${cls}">${lab}</span></div><div class="chips">${prim}</div>` +
      ((ch.alternates||[]).length ? `<div class="lbl">備選</div><div class="chips">${ch.alternates.map(a=>chip(a, day.date)).join("")}</div>` : "") +
      (editing() ? `<div style="margin-top:8px"><button type="button" class="btn sm" data-editch="${s.id}">改選擇／手動輸入</button></div>` : "");
  }
  const others = (s.place_ids||[]).filter(id => !used.has(id));
  const otherHtml = others.length ? `<div class="lbl">地點</div><div class="chips">${others.map(id=>chip(id, day.date)).join("")}</div>` : "";
  return `<article class="card slot"><div class="time">${esc(s.time)}</div><div class="body">
    <h3>${esc(s.title)}${bookBadge(s)}</h3><p>${esc(s.detail)}</p>${choiceHtml}${otherHtml}${s.note?`<div class="note">${esc(s.note)}</div>`:""}</div></article>`;

function statHtml(ex, total){
  if (!ex.length) return `<div class="empty">仲未有記錄，記咗帳先有統計</div>`;
  const group = fn => { const m = {}; ex.forEach(e => { const k = fn(e) || "—"; m[k] = (m[k]||0) + (+e.amount_jpy||0); }); return Object.entries(m); };
  const block = (title, rows) => {
    const mx = Math.max(...rows.map(r=>r[1]), 1);
    return `<div class="card"><b>${title}</b>` + rows.map(([k,v]) => `<div class="stat"><span>${esc(k)}</span><div><div class="bar" style="width:${Math.max(2, v/mx*100)}%"></div></div><span class="v">${yen(v)}</span></div>`).join("") + `</div>`;
  };
  const days = group(e => expDay(e)).sort((a,b) => a[0].localeCompare(b[0])).map(([k,v]) => [k && k !== "—" ? mdw(k) : "冇日期", v]);
  const desc = rows => rows.sort((a,b) => b[1]-a[1]);
  return `<div class="card"><div class="lbl" style="margin:0">累計支出</div><div class="total">${yen(total)}</div><div class="lbl" style="margin:0">${ex.length} 筆</div></div>` +
    block("按日", days) + block("按類別", desc(group(e => e.category))) + block("按付款人", desc(group(e => e.paid_by)));
}

function fitFS(){
  document.querySelectorAll("#fslayer .fit").forEach(el => {
    const max = +el.dataset.max || 96, min = +el.dataset.min || 28;
    el.style.whiteSpace = "nowrap"; let s = max; el.style.fontSize = s + "px";
    while (s > min && el.scrollWidth > el.clientWidth) { s -= 2; el.style.fontSize = s + "px"; }
    if (el.scrollWidth > el.clientWidth) { el.style.whiteSpace = "normal"; el.style.overflowWrap = "anywhere"; }
  });
  document.querySelectorAll("#fslayer .fitg").forEach(el => {
    const max = +el.dataset.max || 60, min = +el.dataset.min || 22; let s = max; el.style.fontSize = s + "px";
    const over = () => [...el.children].some(c => c.scrollWidth > el.clientWidth);
    while (s > min && over()) { s -= 2; el.style.fontSize = s + "px"; }
  });
}

function addrLines(a){
  const m = a.match(/^(.+?[県都府道])?(.+?[市郡])(.+?[区町村])?(.*)$/);
  if (!m) return [a];
  const out = [(m[1]||"") + m[2] + (m[3]||"")];
  const rest = (m[4]||"").trim();
  if (rest) rest.split(/\s+/).forEach(tok => { if (out.length > 1 && tok.length <= 3) out[out.length-1] += " " + tok; else out.push(tok); });
  return out;
}

    <label>地址（日文）</label><input id="n_ad" lang="ja"><div class="grid2"><div><label>電話</label><input id="n_ph" inputmode="tel"></div><div><label>營業時間</label><input id="n_hr"></div></div>
    <label>備註</label><input id="n_nt">
    <div class="row" style="margin-top:16px"><button type="button" class="btn pri" style="flex:1" data-saveplace="${kind}">儲存</button><button type="button" class="btn" data-close="1">取消</button></div>`);
}
function makePlace(kind, f){
  const id = "c_" + uid();
  const ja = f.ja || f.zh, q = encodeURIComponent(`${ja} ${f.addr}`.trim());
  return { id, name_zh:f.zh, name_ja:ja, kind, address_ja:f.addr, phone:f.phone||null, hours:f.hours||null, closed_in_trip:[], lat:null, lng:null,
    maps_url:`https://www.google.com/maps/search/?api=1&query=${q}`, note:f.note||null, tags:["自己新增"] };
}
function choiceSheet(slotId){
  let day, slot; DATA.days.forEach(d => d.slots.forEach(s => { if (s.id === slotId) { day = d; slot = s; } }));
  const ch = effChoice(slot) || { primary:null, status:"open", alternates:[] };
  const P = allPlaces();
  const cands = Object.values(P).filter(p => p.kind === "restaurant" || p.kind === "sight");
  const optP = `<option value="">（未決定）</option>` + cands.map(p => `<option value="${esc(p.id)}" ${p.id===ch.primary?"selected":""}>${esc(p.name_zh)}</option>`).join("");
  const stat = Object.entries(STATUS).map(([k,[l]]) => `<option value="${k}" ${k===ch.status?"selected":""}>${l}</option>`).join("");
  const alts = cands.filter(p => p.id !== ch.primary).map(p => `<label class="chk" style="margin:0;color:var(--ink)"><input type="checkbox" data-alt="${esc(p.id)}" ${(ch.alternates||[]).includes(p.id)?"checked":""}><span>${esc(p.name_zh)}${closureBadges(p, day.date)}</span></label>`).join("");
  openSheet(`<h3>${esc(slot.title)}</h3><div class="ja">${mdw(day.date)}</div>
    <label>狀態</label><select id="c_st">${stat}</select>
    <label>首選</label><select id="c_pr">${optP}</select>
    <div class="note">想用名單冇嘅店：先喺「名單」新增，或者下面直接手動輸入。</div>
    <label>手動輸入（會取代首選）</label><input id="c_zh" placeholder="店名（中文）"><input id="c_ja" lang="ja" placeholder="店名（日文，可留空）" style="margin-top:6px"><input id="c_ad" lang="ja" placeholder="地址（日文）" style="margin-top:6px">
    <label>備選（可多選）</label><div style="max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 10px">${alts}</div>
    <div class="row" style="margin-top:16px"><button type="button" class="btn pri" style="flex:1" data-savech="${slotId}">儲存</button><button type="button" class="btn" data-close="1">取消</button></div>`);
}
function exportSheet(kind){
  let text;
  if (kind === "csv") {
    const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
    text = ["日期時間,店名,類別,邊個出,金額JPY,付款方式,備註"].concat(ov.expenses.slice().sort((a,b)=>a.datetime.localeCompare(b.datetime)).map(e => [e.datetime,e.shop_name,e.category,e.paid_by,e.amount_jpy,e.payment_method,e.note].map(q).join(","))).join("\n");
  } else text = JSON.stringify({ app:"fukuoka2027", version:1, exported_at:new Date().toISOString(), data:ov }, null, 1);
  openSheet(`<h3>${kind==="csv"?"記帳 CSV":"備份"}</h3><div class="note">撳「複製」，貼去備忘錄或 WhatsApp 保存。</div>
    <textarea id="exp_ta" readonly>${esc(text)}</textarea>
    <div class="row" style="margin-top:12px"><button type="button" class="btn pri" style="flex:1" data-copyta="1">複製</button><button type="button" class="btn" data-close="1">關閉</button></div>`);
}
function importSheet(){
  openSheet(`<h3>匯入備份</h3><div class="note">貼上之前匯出嘅備份文字。會取代呢部機而家嘅修改同記帳。</div>
    <textarea id="imp_ta" placeholder="貼上備份 JSON"></textarea>
    <div class="row" style="margin-top:12px"><button type="button" class="btn pri" style="flex:1" data-doimport="1">匯入</button><button type="button" class="btn" data-close="1">取消</button></div>`);
}

/* ---------- 事件 ---------- */
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-tab],[data-day],[data-seg],[data-mseg],[data-place],[data-addplace],[data-saveplace],[data-delplace],[data-editch],[data-savech],[data-addexp],[data-exp],[data-saveexp],[data-delexp],[data-driver],[data-fsclose],[data-copy],[data-copyta],[data-export],[data-import],[data-doimport],[data-addchk],[data-savepaidby],[data-close],[data-mask],#editPill");
  if (!t) return;
  const d = t.dataset;
  if (t.id === "editPill") { ov.editMode = !ov.editMode; save(); render(); toast(ov.editMode ? "編輯模式已開" : "編輯模式已關"); return; }
  if (d.mask) { if (ev.target === t) closeSheet(); return; }
  if (d.close) return closeSheet();
  if (d.tab) { ui.tab = d.tab; render(); window.scrollTo(0,0); return; }
  if (d.day) { ui.day = d.day; render(); return; }
  if (d.seg) { ui.listSeg = d.seg; render(); return; }
  if (d.mseg) { ui.moneySeg = d.mseg; render(); return; }
  if (d.place) return placeSheet(d.place, d.date);
  if (d.addplace) return placeForm(d.addplace);
  if (d.saveplace) {
    const f = { zh:$("#n_zh").value.trim(), ja:$("#n_ja").value.trim(), addr:$("#n_ad").value.trim(), phone:$("#n_ph").value.trim(), hours:$("#n_hr").value.trim(), note:$("#n_nt").value.trim() };
    if (!f.zh) return toast("請輸入名稱");
    const p = makePlace(d.saveplace, f); ov.customPlaces[p.id] = p; save(); closeSheet(); render(); return toast("已新增");
  }
  if (d.delplace) { delete ov.customPlaces[d.delplace]; Object.keys(ov.slotChoice).forEach(k => { const c = ov.slotChoice[k]; if (c.primary === d.delplace) c.primary = null; c.alternates = (c.alternates||[]).filter(x => x !== d.delplace); }); save(); closeSheet(); render(); return; }
  if (d.editch) return choiceSheet(d.editch);
  if (d.savech) {
    const o = { status:$("#c_st").value, primary:$("#c_pr").value || null, alternates:[...document.querySelectorAll("[data-alt]:checked")].map(x => x.dataset.alt) };
    const zh = $("#c_zh").value.trim();
    if (zh) { const p = makePlace("restaurant", { zh, ja:$("#c_ja").value.trim(), addr:$("#c_ad").value.trim() }); ov.customPlaces[p.id] = p; o.primary = p.id; }
    o.alternates = o.alternates.filter(x => x !== o.primary);
    ov.slotChoice[d.savech] = o; save(); closeSheet(); render(); return toast("已儲存");
  }
  if (d.addexp) return expSheet(null);
  if (d.exp) { if (editing()) return expSheet(d.exp); return toast("開咗編輯模式先可以修改"); }
  if (d.saveexp !== undefined && t.hasAttribute("data-saveexp")) {
    const amt = parseInt(($("#x_amt").value||"").replace(/[^\d]/g,""), 10);
    if (!amt) return toast("請輸入金額");
    const rec = { id:d.saveexp || uid(), shop_name:$("#x_shop").value.trim(), amount_jpy:amt, datetime:$("#x_dt").value, category:$("#x_cat").value, paid_by:$("#x_by").value, payment_method:$("#x_pm").value, note:$("#x_note").value.trim(), updated_at:new Date().toISOString() };
    if (d.saveexp) { const i = ov.expenses.findIndex(x => x.id === d.saveexp); rec.created_at = ov.expenses[i].created_at; ov.expenses[i] = rec; }
    else { rec.created_at = rec.updated_at; ov.expenses.push(rec); }
    save(); closeSheet(); render(); return toast("已記低");
  }
  if (d.delexp) { ov.expenses = ov.expenses.filter(x => x.id !== d.delexp); save(); closeSheet(); render(); return toast("已刪除"); }
  if (d.fsclose) return closeFS();
  if (d.driver) { ev.stopPropagation(); return driverFS(d.driver); }
  if (d.copy !== undefined && t.hasAttribute("data-copy")) return copy(d.copy);
  if (d.copyta) { const ta = $("#exp_ta"); ta.select(); return copy(ta.value); }
  if (d.export) return exportSheet(d.export);
  if (d.import) return importSheet();
  if (d.doimport) {
    try {
      const j = JSON.parse($("#imp_ta").value);
      const data = j && j.data ? j.data : null;
      if (!data || typeof data !== "object") throw new Error("格式唔啱");
      ov = Object.assign(blank(), data); save(); closeSheet(); render(); toast("已匯入");
    } catch(e){ toast("匯入失敗：內容唔係有效備份"); }
    return;
  }
  if (d.addchk !== undefined) { const inp = $("#addchk"+d.addchk); const v = inp.value.trim(); if (!v) return; (ov.extraChecks[d.addchk] ||= []).push(v); save(); render(); return; }
  if (d.savepaidby) { const arr = $("#paidby").value.split(",").map(s => s.trim()).filter(Boolean); if (!arr.length) return toast("至少要有一個"); ov.paidBy = arr; save(); toast("已儲存"); return; }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset.chk) { ov.checks[t.dataset.chk] = t.checked; save(); render(); return; }
  if (t.dataset.flt) { const o = (ov.flights[t.dataset.flt] ||= {}); o[t.dataset.f] = t.value; save(); render(); return; }
  if (t.dataset.rent) { ov.rental[t.dataset.rent] = t.value; save(); return; }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "tq" || t.id === "pq") { ui[t.id] = t.value; const pos = t.selectionStart, id = t.id; render(); const n = $("#"+id); n.focus(); try { n.setSelectionRange(pos,pos); } catch(e){} return; }
  if (t.id === "q") { ui.q = t.value; const pos = t.selectionStart; render(); const n = $("#q"); n.focus(); try { n.setSelectionRange(pos,pos); } catch(e){} }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") { if ($("#fslayer").innerHTML) closeFS(); else closeSheet(); } });
window.addEventListener("online", render); window.addEventListener("offline", render);
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (tabsDef.some(t => t[0] === h)) { ui.tab = h; render(); } });
render();
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}}
</script>
</body>
</html>
